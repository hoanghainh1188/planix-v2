name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited`: re-check the review evidence when the PR description is filled in after opening.
    types: [opened, edited, synchronize, reopened]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - name: Review evidence in the PR description (decision 2026-09-15-005-single-owner-branch-protection)
        if: github.event_name == 'pull_request'
        env:
          # Passed as data through the environment, never interpolated into the shell command.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/check-review-evidence.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage (Testcontainers uses the runner's Docker)
        run: npm run test -- --coverage

      - name: Build
        run: npm run build

  docker-image:
    # The demo is deployed from this Dockerfile; a broken image should fail the PR, not the deploy.
    # Skipped when only the PR description was edited.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the demo image (decision 2026-09-15-018-demo-deploy)
        run: docker build -t planix-demo:ci .
