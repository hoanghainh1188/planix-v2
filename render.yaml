# Render Blueprint — DEMO environment only (decision docs/04-decisions/2026-09-15-018-demo-deploy.md).
# Setup and first Operator: docs/DEPLOY-DEMO.md. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: planix-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    # Deploy a commit on main only after its GitHub checks pass.
    autoDeployTrigger: checksPass
    healthCheckPath: /api/v1/health
    envVars:
      # https://<service>.onrender.com — must equal the browser origin (cookies, Origin check, email links).
      - key: APP_BASE_URL
        sync: false
      # Neon DIRECT connection strings (not the -pooler host), each with ?sslmode=verify-full.
      - key: DATABASE_URL_OWNER
        sync: false
      - key: DATABASE_URL_APP
        sync: false
      - key: DATABASE_URL_PLATFORM
        sync: false
      # Mailtrap sandbox, port 2525 (Render free blocks 25/465/587): smtp://<user>:<password>@<host>:2525
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: 'Planix Demo <no-reply@planix-demo.test>'
      # Checked on the demo 2026-09-16 (#14): 1 hop cannot be fooled by a spoofed X-Forwarded-For but keys on a rotating
      # internal proxy (~3 buckets shared by all users); 2 hops keyed on more proxies (~6). Kept at 1 until the real
      # header chain is read (docs/DEPLOY-DEMO.md §5).
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: DATABASE_APP_POOL_MAX
        value: '10'
