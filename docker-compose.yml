# Dev services only. Credentials here are local-development defaults, never used outside docker compose.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: planix
      POSTGRES_USER: planix_owner
      POSTGRES_PASSWORD: planix_owner_dev
    ports:
      - '5432:5432'
    volumes:
      - planix-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planix_owner -d planix']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  planix-postgres:
